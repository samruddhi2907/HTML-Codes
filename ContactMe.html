<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact Me</title>
</head>
<body>
    <form>
        Name:
        <input type="text" placeholder="Enter your full name" required><br><br>
        Email:
        <input type="email"  placeholder="Enter your email" required><br><br>
        Phone:
        <input type="number" placeholder="enter your number" required><br><br>
        Gender:<br><br>
        <input type="radio" value="Male">Male
        <input type="radio" value="Female">Female<br><br>
        DOB:
        <input type="date" placeholder="Enter your Date of Birth " required><br><br>
        Subject:
        <input type="text" value="subject" placeholder="Enter your subject" required><br><br>
        Message:<br><br>
        <textarea rows="5" cols="10" required></textarea><br><br>
        Country:<br><br>
        <select required>
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Japan</option>
            <option>Canada</option>
            <option>Dubai</option>
        </select><br><br>
        Skills:<br><br>
        <input type="checkbox" name="skills" value="HTML">HTML<br>
         <input type="checkbox" name="skills" value="C">C<br>
          <input type="checkbox" name="skills" value="C++">C++<br>
           <input type="checkbox" name="skills" value="CSS"> CSS<br>
            <input type="checkbox" name="skills" value="Java">Java<br>
             <input type="checkbox" name="skills" value="DBMS">DBMS<br>
              <input type="checkbox" name="skills" value="SQL">SQL<br>
              <input type="submit" value="submit">
              <input type="reset"><br><br>

    </form>
    
</body>
</html>
